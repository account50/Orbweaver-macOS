[package]
name = "orbweaver"
version = "0.1.0"
edition = "2024"
description = "Independent native configuration for Razer Orbweaver and Orbweaver Chroma"
repository = "https://github.com/account50/Orbweaver-macOS"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
core-graphics = "0.23.2"
ctrlc = "3.5.2"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
